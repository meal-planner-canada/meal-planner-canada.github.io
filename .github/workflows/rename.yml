name: Rename countdown file to index
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  rename:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: |
          if [ -f christmas-countdown/christmas-countdown.html ] && [ ! -f christmas-countdown/index.html ]; then
            git config user.name "meal-planner-canada"
            git config user.email "meal-planner-canada@users.noreply.github.com"
            git mv christmas-countdown/christmas-countdown.html christmas-countdown/index.html
            git commit -m "Rename christmas-countdown.html to index.html"
            git push
          else
            echo "Nothing to rename"
          fi
