name: Rename app file to index
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  rename:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: |
          if [ -f meal-planner-canada.html ] && [ ! -f index.html ]; then
            git config user.name "meal-planner-canada"
            git config user.email "meal-planner-canada@users.noreply.github.com"
            git mv meal-planner-canada.html index.html
            git commit -m "Rename meal-planner-canada.html to index.html"
            git push
          else
            echo "Nothing to rename"
          fi
